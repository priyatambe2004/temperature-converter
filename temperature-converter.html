<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature Converter</title>
  <style>
    :root {
      --paper: #f4f6fa;
      --ink: #14213d;
      --muted: #55607a;
      --accent: #f2a900;
      --teal: #1f7a8c;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .converter {
      width: 100%;
      max-width: 26rem;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 6px 6px 0 var(--accent);
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.7rem; }
    .hint { margin: 0 0 1.5rem; color: var(--muted); }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
    input {
      width: 100%;
      font: inherit;
      font-size: 1.15rem;
      padding: 0.6rem 0.8rem;
      border: 2px solid var(--ink);
      border-radius: 0.5rem;
      background: var(--paper);
    }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input.invalid { border-color: var(--error); background: #fdeceb; }
    .message { min-height: 1.4rem; margin: 0 0 1rem; color: var(--error); font-weight: 500; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border: 2px solid var(--ink);
      border-radius: 0.5rem;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--teal); border-color: var(--teal); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="converter">
    <h1>Temperature Converter</h1>
    <p class="hint">Type in any box. The other two update as you type.</p>

    <div class="field">
      <label for="celsius">Celsius (°C)</label>
      <input id="celsius" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 25">
    </div>
    <div class="field">
      <label for="fahrenheit">Fahrenheit (°F)</label>
      <input id="fahrenheit" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 77">
    </div>
    <div class="field">
      <label for="kelvin">Kelvin (K)</label>
      <input id="kelvin" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 298.15">
    </div>

    <p id="message" class="message" role="alert"></p>
    <button id="clear" type="button">Clear all</button>
  </main>

  <script>
  
    function celsiusToFahrenheit(c) { return c * 9 / 5 + 32; }
    function celsiusToKelvin(c)     { return c + 273.15; }
    function fahrenheitToCelsius(f) { return (f - 32) * 5 / 9; }
    function kelvinToCelsius(k)     { return k - 273.15; }

    
    const inputs = {
      celsius: document.getElementById("celsius"),
      fahrenheit: document.getElementById("fahrenheit"),
      kelvin: document.getElementById("kelvin")
    };
    const message = document.getElementById("message");
    const ABSOLUTE_ZERO_C = -273.15;

   
    function round(n) { return Math.round(n * 100) / 100; }

    
    function parseValue(text) {
      const trimmed = text.trim();
      if (trimmed === "" || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(trimmed)) return null;
      return Number(trimmed);
    }

    function clearErrors() {
      message.textContent = "";
      Object.values(inputs).forEach(function (el) { el.classList.remove("invalid"); });
    }

    function clearOthers(source) {
      Object.keys(inputs).forEach(function (name) {
        if (name !== source) inputs[name].value = "";
      });
    }

    function showError(source, text) {
      inputs[source].classList.add("invalid");
      message.textContent = text;
      clearOthers(source);
    }

    
    function handleInput(source) {
      clearErrors();
      const raw = inputs[source].value;

      
      if (raw.trim() === "" || raw.trim() === "-" || raw.trim() === "." || raw.trim() === "-.") {
        clearOthers(source);
        return;
      }

      const value = parseValue(raw);
      if (value === null) {
        showError(source, "Enter a number only, like 25 or -3.5.");
        return;
      }

      
      let celsius;
      if (source === "celsius") celsius = value;
      else if (source === "fahrenheit") celsius = fahrenheitToCelsius(value);
      else celsius = kelvinToCelsius(value);

      if (celsius < ABSOLUTE_ZERO_C - 1e-9) {
        showError(source, "That is below absolute zero (-273.15 °C, 0 K, -459.67 °F).");
        return;
      }

      if (source !== "celsius")    inputs.celsius.value    = round(celsius);
      if (source !== "fahrenheit") inputs.fahrenheit.value = round(celsiusToFahrenheit(celsius));
      if (source !== "kelvin")     inputs.kelvin.value     = round(celsiusToKelvin(celsius));
    }

    Object.keys(inputs).forEach(function (name) {
      inputs[name].addEventListener("input", function () { handleInput(name); });
    });

    document.getElementById("clear").addEventListener("click", function () {
      Object.values(inputs).forEach(function (el) { el.value = ""; });
      clearErrors();
      inputs.celsius.focus();
    });
  </script>
</body>
</html>
